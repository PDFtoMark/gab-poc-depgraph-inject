name: Dependency Review POC
on:
  workflow_run:
    workflows: ["PR Workflow"]
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  dependency-review:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const wfRun = context.payload.workflow_run;
            const pr = wfRun.pull_requests[0];
            core.info(`is_fork: ${pr ? 'false' : 'true'}`);
            core.info(`head_repo: ${wfRun.head_repository.full_name}`);
            core.setOutput('number', pr ? pr.number : 0)

      - name: Download attacker artifact (stands in for gradle download-and-submit)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: dependency-graph_*
          path: depgraph
          github-token: ${{ github.token }}

      - name: Emulate dependency-review-action comment-content output
        id: dependency-review
        run: |
          {
            echo 'comment-content<<GAB_DELIM'
            cat depgraph/*/*.txt
            echo 'GAB_DELIM'
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.dependency-review.outputs.comment-content != null }}
        name: Save dependency review output report
        run: |
          cat << 'EOF' > openssf-report.html
          ${{ steps.dependency-review.outputs.comment-content }}
          EOF

      - name: Next action holding the PAT (mirrors sticky-pull-request-comment)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.POC_TOKEN }}
          script: |
            try { await github.rest.repos.get({owner: context.repo.owner, repo: context.repo.repo}) } catch (e) { core.warning(String(e)) }

      - name: Verify markers
        if: always()
        run: |
          echo "--- shell injection marker ---"
          cat /tmp/gab_rce_marker 2>/dev/null || echo MISSING
          echo "--- captured Authorization header ---"
          cat /tmp/gab_token_capture 2>/dev/null || echo MISSING
