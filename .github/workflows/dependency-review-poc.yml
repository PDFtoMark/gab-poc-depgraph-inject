name: Dependency Review POC
on:
  workflow_run:
    workflows: ["PR Workflow"]
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  dependency-review:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR
        id: get-pr
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const wfRun = context.payload.workflow_run;
            const pr = wfRun.pull_requests[0];
            let number, base_sha, head_sha;
            if (pr) {
              number = pr.number;
              base_sha = pr.base.sha;
              head_sha = pr.head.sha;
            } else {
              const headLabel = `${wfRun.head_repository.owner.login}:${wfRun.head_branch}`;
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: headLabel,
              });
              const matched = prs[0];
              if (!matched) throw new Error(`No open PR found for head ${headLabel}`);
              number = matched.number;
              base_sha = matched.base.sha;
              head_sha = wfRun.head_sha;
            }
            core.info(`is_fork:  ${pr ? 'false' : 'true'}`);
            core.info(`number:   ${number}`);
            core.setOutput('is_fork', pr ? 'false' : 'true');
            core.setOutput('number', number);
            core.setOutput('base_sha', base_sha);
            core.setOutput('head_sha', head_sha)

      - name: Download attacker artifact (stands in for gradle download-and-submit)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: dependency-graph_*
          path: depgraph
          github-token: ${{ github.token }}

      - name: Emulate dependency-review-action comment-content output
        id: dependency-review
        run: |
          {
            echo 'comment-content<<GAB_DELIM'
            cat depgraph/*/*.txt
            echo 'GAB_DELIM'
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.dependency-review.outputs.comment-content != null }}
        name: Save dependency review output report
        run: |
          cat << 'EOF' > openssf-report.html
          ${{ steps.dependency-review.outputs.comment-content }}
          EOF

      - name: Next node action (inherits GITHUB_ENV from injected step)
        uses: actions/github-script@v7
        with:
          script: |
            core.info('subsequent node action executed')

      - name: Verify markers
        if: always()
        run: |
          echo "--- openssf-report.html head ---"
          head -c 300 openssf-report.html || true
          echo
          echo "--- shell injection marker ---"
          cat /tmp/gab_rce_marker 2>/dev/null || echo MISSING
          echo "--- NODE_OPTIONS marker ---"
          cat /tmp/gab_node_marker 2>/dev/null || echo MISSING
