name: Dependency Review POC
on:
  workflow_run:
    workflows: ["PR Workflow"]
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  dependency-review:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const wfRun = context.payload.workflow_run;
            const pr = wfRun.pull_requests[0];
            core.info(`is_fork: ${pr ? 'false' : 'true'}`);
            core.setOutput('number', pr ? pr.number : 0);

      - name: Download attacker artifact (mirrors gradle download-and-submit)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: dependency-graph_*
          path: depgraph
          github-token: ${{ github.token }}

      - name: Render output exactly like dependency-review-action 'Scanned Files'
        id: dependency-review
        run: |
          python3 - <<'PY'
          import glob, json, os
          items = []
          for f in glob.glob('depgraph/**/*.json', recursive=True):
              for k in json.load(open(f)).get('manifests', {}):
                  items.append(k)
          html = '<h2>Scanned Files</h2><ul>' + ''.join(f'<li>{i}</li>' for i in items) + '</ul>'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write('comment-content<<GAB_DELIM\n' + html + '\nGAB_DELIM\n')
          PY

      - if: ${{ steps.dependency-review.outputs.comment-content != null }}
        name: Save dependency review output report
        run: |
          cat << 'EOF' > openssf-report.html
          ${{ steps.dependency-review.outputs.comment-content }}
          EOF

      - name: Next action holding a credential (mirrors sticky-pull-request-comment)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try { const r = await github.rest.repos.get({owner: context.repo.owner, repo: context.repo.repo}); core.info('ok ' + r.data.full_name) } catch (e) { core.warning(String(e)) }

      - name: Verify markers
        if: always()
        run: |
          echo "--- rce marker ---"; cat /tmp/gab_rce_marker 2>/dev/null || echo MISSING
          echo "--- tampered action dump ---"; cat /tmp/gab_action_tamper 2>/dev/null || echo MISSING
