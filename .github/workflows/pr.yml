name: PR Workflow
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Emit attacker-controlled dependency-graph artifact
        run: |
          mkdir -p out
          cp evil.json out/evil.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_evil.json
          path: out/evil.json
